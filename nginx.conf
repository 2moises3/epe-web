server {
    listen 80;
    server_name _;

    # Allow normal-sized authentication/session cookies without rejecting the request.
    large_client_header_buffers 4 16k;

    root /usr/share/nginx/html;
    index index.html;

    # Disable browser/proxy caching for the application shell and static frontend assets.
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;

    # React Router needs the SPA entry point for direct navigation to a route.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
