<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/image/logo_empresa_only.webp" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AgroExportaciones F&V</title>
    <!-- Aplica el tema guardado antes de pintar, para evitar el destello claro en modo oscuro. Sin elección guardada
         la app arranca en claro (no sigue al sistema operativo). Misma lógica y clave que src/shared/hooks/useTheme.ts -->
    <script>
        (function () {
            var theme = null;
            try { theme = localStorage.getItem("epe-theme"); } catch (e) {}
            if (theme === "dark") document.documentElement.classList.add("dark");
        })();
    </script>
</head>

<body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
</body>

</html>
