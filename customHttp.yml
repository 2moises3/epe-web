customHeaders:
  - pattern: '**'
    headers:
      - key: Cache-Control
        value: 'no-store, no-cache, must-revalidate, max-age=0'
      - key: Pragma
        value: 'no-cache'
      - key: Expires
        value: '0'
      - key: Strict-Transport-Security
        value: 'max-age=31536000; includeSubDomains'
      - key: X-Content-Type-Options
        value: 'nosniff'
      - key: X-Frame-Options
        value: 'SAMEORIGIN'
      - key: Referrer-Policy
        value: 'strict-origin-when-cross-origin'
